name: Buat video panjang

# Hanya dijalankan MANUAL. Tidak ada jadwal otomatis, tidak mengunggah ke platform mana pun,
# dan tidak mengubah isi repo. Hasilnya hanya disimpan di Artifacts untuk diunduh.
on:
  workflow_dispatch:
    inputs:
      file_cerita:
        description: "File cerita, contoh: cerita_panjang/kamar-nomor-tujuh.json"
        required: false
        default: ""
      mock:
        description: "Uji coba tanpa internet (gambar & suara palsu, tidak memakai kuota)"
        type: boolean
        default: false
      pakai_gambar_dari_run:
        description: "Opsional: nomor run sebelumnya (angka di alamat run) untuk memakai ulang gambar yang sudah jadi"
        required: false
        default: ""

permissions:
  contents: read
  actions: read      # hanya untuk mengunduh gambar dari run sebelumnya

concurrency:
  group: buat-video-panjang
  cancel-in-progress: false

jobs:
  buat:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang ffmpeg dan font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p fonts
          curl -sSfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
          curl -sSfL -o fonts/Montserrat-ExtraBold.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf || true

      - name: Pasang library Python
        run: pip install -r requirements.txt

      - name: Ambil gambar dari run sebelumnya
        if: github.event.inputs.pakai_gambar_dari_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.inputs.pakai_gambar_dari_run }}
        run: |
          case "$RUN_ID" in (*[!0-9]*) echo "Nomor run harus berupa angka"; exit 1;; esac
          mkdir -p simpanan_panjang
          gh run download "$RUN_ID" --name gambar-panjang --dir simpanan_panjang || echo "Tidak ada gambar tersimpan di run itu; mulai dari awal"
          find simpanan_panjang -type f | wc -l

      - name: Cek kunci Cloudflare khusus video panjang
        if: github.event.inputs.mock != 'true'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PANJANG }}
          AKUN: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PANJANG }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$AKUN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN_PANJANG atau CLOUDFLARE_ACCOUNT_ID_PANJANG kosong. Video panjang sengaja TIDAK memakai kunci video pendek, jadi berhenti di sini."
            exit 1
          fi
          echo "Kunci Cloudflare video panjang terisi."

      - name: Buat video panjang
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # akun Cloudflare KHUSUS video panjang (terpisah dari video pendek); nama variabel tetap karena kode membacanya
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PANJANG }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PANJANG }}
          FILE_CERITA: ${{ github.event.inputs.file_cerita }}
          MOCK: ${{ github.event.inputs.mock == 'true' && '1' || '' }}
        run: python panjang_main.py

      - name: Simpan video untuk diunduh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-panjang
          path: hasil_panjang/
          retention-days: 7
          if-no-files-found: ignore

      # Gambar disimpan walau proses gagal, supaya bisa dipakai ulang (hemat kuota Cloudflare)
      - name: Simpan gambar yang sudah jadi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gambar-panjang
          path: simpanan_panjang/
          retention-days: 14
          overwrite: true
          compression-level: 0
          if-no-files-found: ignore
